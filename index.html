    <style>
      :root {
        --scrollbar-width: 6px;
        --scrollbar-track: transparent;
        --scrollbar-thumb: rgba(0, 0, 0, 0.1);
        --scrollbar-thumb-hover: rgba(0, 0, 0, 0.2);
      }

      html.dark {
        --scrollbar-thumb: rgba(255, 255, 255, 0.1);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.2);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        scrollbar-gutter: stable;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        image-rendering: -webkit-optimize-contrast;
      }

      /* Mac-style Minimal Scrollbars */
      ::-webkit-scrollbar {
        width: var(--scrollbar-width);
        height: var(--scrollbar-width);
      }

      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 20px; }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

      /* Safari Backdrop Blur Fix */
      .glass-effect {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      /* Mac Focus Ring */
      :focus-visible {
        outline: 2px solid #4f46e5;
        outline-offset: 2px;
      }

      /* Prevent selection on buttons */
      button {
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
